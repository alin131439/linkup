<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LinkUp</title>
    <script>
      // GitHub Pages SPA redirect trick for project sites
      // Handles URLs like: https://alin131439.github.io/linkup/connections
      // Redirects to: https://alin131439.github.io/linkup/?/connections
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var newPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
      var restPath = l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        newPath +
        (restPath ? '/?/' + restPath : '') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
