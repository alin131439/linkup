<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LinkUp</title>
    <script>
      // GitHub Pages SPA redirect for /linkup/ base path
      var l = window.location;
      // Check if path already points to index.html (avoid redirect loop)
      if (l.pathname !== '/linkup/' && l.pathname !== '/linkup/index.html') {
        var path = l.pathname.replace('/linkup/', '');
        if (path.startsWith('/')) path = path.slice(1);
        l.replace(
          '/linkup/?/' +
          path.replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
